name: Validate content

# Every publication to main is a publication to students, so the content
# contract is checked on the pull request and again on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate the collections
        run: node scripts/validate.mjs

      - name: Validate the validator
        run: node scripts/selftest.mjs
