<path d="M180 230 L125 175 C85 135 150 100 180 140 C210 100 275 135 235 175 Z" fill="#ef4160"/>
<text x="345" y="125" font-family="sans-serif" font-size="32" fill="#16344b">ENGG 1102</text><text x="345" y="175" font-family="sans-serif" font-size="26" fill="#16344b">Write</text><text x="345" y="215" font-family="sans-serif" font-size="26" fill="#16344b">Run</text><text x="345" y="255" font-family="sans-serif" font-size="26" fill="#16344b">Check</text>
