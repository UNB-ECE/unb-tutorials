  <rect width="640" height="360" rx="24" fill="#271336"/>
  <path d="M92 160H530" stroke="#b57ccc" stroke-width="3"/>
  <path d="m520 151 12 9-12 9" fill="none" stroke="#b57ccc" stroke-width="3"/>
  <g stroke="#694678" stroke-width="5">
    <circle cx="96" cy="216" r="34" fill="#ff667a"/>
    <circle cx="208" cy="216" r="34" fill="#80dfaa"/>
    <circle cx="320" cy="216" r="34" fill="#8fbdff"/>
    <circle cx="432" cy="216" r="34" fill="#ffd878"/>
    <circle cx="544" cy="216" r="34" fill="#c29cff"/>
